name: Deploy BTCstax to Hetzner

on:
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build & Deploy BTCstax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Landingpage Code
        uses: actions/checkout@v4
        with:
          repository: aleks-83/btcstax-website
          token: ${{ secrets.GH_PAT }}
          path: btcstax-website

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install
        working-directory: ./btcstax-website

      - name: Build Project
        run: npm run build
        env:
          NITRO_PRESET: static
          NITRO_PRERENDER: true
        working-directory: ./btcstax-website

      - name: Ensure index.html exists
        run: |
          if [ ! -f "./btcstax-website/.output/public/index.html" ]; then
            echo "Creating SPA fallback index.html for Apache..."
            if [ -f "./btcstax-website/index.html" ]; then
              cp ./btcstax-website/index.html ./btcstax-website/.output/public/index.html
            elif [ -f "./btcstax-website/public/index.html" ]; then
              cp ./btcstax-website/public/index.html ./btcstax-website/.output/public/index.html
            fi
          fi

      - name: Inspect Output Folder Structure
        run: |
          echo "=== Inhaltsverzeichnis von .output/public ==="
          ls -la ./btcstax-website/.output/public/
        continue-on-error: true

      - name: Sync Files to Hetzner FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /public_html/btcstax/
          local-dir: ./btcstax-website/.output/public/
