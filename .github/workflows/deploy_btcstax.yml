name: Deploy BTCstax to Hetzner

on:
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build & Deploy BTCstax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Landingpage Code
        uses: actions/checkout@v4
        with:
          repository: aleks-83/btcstax-website

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Sync Files to Hetzner FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /public_html/btcstax/
          local-dir: ./dist/
