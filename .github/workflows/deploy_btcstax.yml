name: Deploy BTCstax to Hetzner

on:
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build & Deploy BTCstax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Landingpage Code
        uses: actions/checkout@v4
        with:
          repository: aleks-83/btcstax-website
          token: ${{ secrets.GH_PAT }}
          path: btcstax-website

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install
        working-directory: ./btcstax-website

      - name: Build Project
        run: npm run build
        working-directory: ./btcstax-website

      - name: Determine Output Directory
        id: set_dir
        run: |
          if [ -d "./btcstax-website/dist" ]; then
            echo "upload_dir=./btcstax-website/dist/" >> $GITHUB_OUTPUT
          elif [ -d "./btcstax-website/build" ]; then
            echo "upload_dir=./btcstax-website/build/" >> $GITHUB_OUTPUT
          else
            echo "Build failed: Neither dist nor build directory found."
            exit 1
          fi

      - name: Sync Files to Hetzner FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /public_html/btcstax/
          local-dir: ${{ steps.set_dir.outputs.upload_dir }}
